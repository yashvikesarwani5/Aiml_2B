<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let s = "yashvi";

        console.log("1.original :" , s);

        let b = s.toUpperCase();
        console.log("2. Uppercase :" , b);

        let c = s.toLowerCase();
        console.log("3. Lowercase :" , c);

        let d = s.charAt(6);
        console.log("4. Character at index 6:", d);

        let e = s.charAt(s.length - 1);
        console.log("5. Last character:", e);

        let f = s.slice(0, 5);
        console.log("6. Slice (0,5):", f);

        let g = s.split(" ");
        console.log("7. Split:", g);


        let h = s.includes("yashvi kesarwani");
        console.log("8. Includes yashvi kesarwani:", h);


        let i = s.replace("yashvi", "yashdeep");
        console.log("9. Replace:", i);

    </script>
</head>
<body>
    
</body>
</html>
