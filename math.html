<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Functions</title>

    <script>

        let a = 5.7;


        console.log("1. Floor:", Math.floor(a));


 
        console.log("2. Round:", Math.round(a));


    
        console.log("3. Ceil:", Math.ceil(a));


     
        console.log("4. Trunc:", Math.trunc(a));


        console.log("5. Sin:", Math.sin(0));


        
        console.log("6. Square root:", Math.sqrt(25));


        console.log("7. Power:", Math.pow(2, 3));


    </script>
</head>

<body>

    <h1>JavaScript Math Functions</h1>

</body>
</html>
