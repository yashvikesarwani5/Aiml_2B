<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Operations</title>

    <script>
        let a = ["vikas", "rahul", "aman", "yash"];

        console.log("1. Original:", [...a]);


        a.push("rohit");
        console.log("2. After PUSH:", [...a]);


        let data = a.pop();
        console.log("3. POP removed:", data);
        console.log("   After POP:", [...a]);


        a.unshift("neha");
        console.log("4. After UNSHIFT:", [...a]);

        data = a.shift();
        console.log("5. SHIFT removed:", data);
        console.log("   After SHIFT:", [...a]);

        let b = a.slice(1, 3);
        console.log("6. SLICE result:", [...b]);

        console.log("7. Original array after SLICE:", [...a]);
    </script>
</head>

<body>
    <h1>Array Operations</h1>
</body>
</html>
